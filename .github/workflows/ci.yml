name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://estate_app:app_ci_password_long_enough_123@localhost:5432/estate
      MIGRATION_DATABASE_URL: postgresql://estate_owner:owner_ci_pw@localhost:5432/estate
      SHADOW_DATABASE_URL: postgresql://estate_owner:owner_ci_pw@localhost:5432/estate_shadow
      APP_DB_PASSWORD: app_ci_password_long_enough_123
      SETUP_TOKEN: ci-setup-token-long-enough
      SEED_ADMIN_EMAIL: admin@example.test
      SEED_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create database roles and databases
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE estate_owner LOGIN PASSWORD 'owner_ci_pw' CREATEDB CREATEROLE;
          CREATE DATABASE estate OWNER estate_owner;
          CREATE DATABASE estate_shadow OWNER estate_owner;
          CREATE DATABASE estate_it OWNER estate_owner;
          SQL

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Database setup as on the server (runtime role, migrations, privileges)
        run: npm run db:setup

      - name: Database setup is repeatable (runs on every deploy)
        run: npm run db:setup

      - name: Check migrations match the Prisma schema
        run: scripts/ci-run.sh "Migration drift" npm run db:check-drift

      - name: Row-level security tests (as the app role)
        run: npm run test:rls

      - name: Type check
        run: scripts/ci-run.sh "Type check" npx tsc --noEmit

      - name: Unit tests
        run: scripts/ci-run.sh "Unit tests" npm run test:unit

      - name: Integration tests (separate database, app role)
        env:
          MIGRATION_DATABASE_URL: postgresql://estate_owner:owner_ci_pw@localhost:5432/estate_it
          DATABASE_URL: postgresql://estate_app:app_ci_password_long_enough_123@localhost:5432/estate_it
        run: |
          npm run db:setup
          scripts/ci-run.sh "Integration tests" npm run test:integration

      - name: Backup and restore (dump the integration database, restore it elsewhere, compare)
        run: scripts/ci-run.sh "Backup and restore" scripts/backup-restore-check.sh estate_it estate_it_restored

      - name: Production build
        run: scripts/ci-run.sh "Production build" npm run build

      - name: Seed demo data and smoke-test the running app
        env:
          SEED_DEMO_DATA: "true"
        run: scripts/ci-run.sh "Smoke test" scripts/smoke.sh

      - name: Install browsers for the device check
        run: npx playwright install --with-deps chromium webkit

      - name: Device check (desktop, iPhone, Android, tablet)
        env:
          DEVICE_STRICT: ${{ vars.DEVICE_STRICT || 'true' }}
        run: scripts/ci-run.sh "Device check" scripts/device-check.sh

      - name: Save device screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-report
          path: device-report
          if-no-files-found: ignore

      - name: Publish device screenshots to the device-shots branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          [ -d device-report ] || exit 0
          cp -r device-report /tmp/device-report
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git checkout --orphan device-shots
          git rm -rf -q --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/device-report/* .
          git add -A && git commit -q -m "Device screenshots for ${GITHUB_SHA}"
          git push -q -f origin device-shots

      - name: Save the resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
