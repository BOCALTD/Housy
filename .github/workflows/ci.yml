name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://estate_app:app_ci_password_long_enough_123@localhost:5432/estate
      MIGRATION_DATABASE_URL: postgresql://estate_owner:owner_ci_pw@localhost:5432/estate
      SHADOW_DATABASE_URL: postgresql://estate_owner:owner_ci_pw@localhost:5432/estate_shadow
      APP_DB_PASSWORD: app_ci_password_long_enough_123
      SETUP_TOKEN: ci-setup-token-long-enough
      SEED_ADMIN_EMAIL: admin@example.test
      SEED_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create database roles and databases
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE estate_owner LOGIN PASSWORD 'owner_ci_pw' CREATEDB CREATEROLE;
          CREATE DATABASE estate OWNER estate_owner;
          CREATE DATABASE estate_shadow OWNER estate_owner;
          SQL

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Database setup as on Vercel (runtime role, migrations, privileges)
        run: npm run db:setup

      - name: Database setup is repeatable (runs on every deploy)
        run: npm run db:setup

      - name: Check migrations match the Prisma schema
        run: npm run db:check-drift

      - name: Row-level security tests (as the app role)
        run: npm run test:rls

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (real database, app role)
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration.log || {
            # Surface the failure as an annotation so it is readable without downloading logs.
            node -e 'const s=require("fs").readFileSync("integration.log","utf8").split("\n");const i=s.findIndex(l=>/^not ok|^\s+not ok/.test(l));const out=(i<0?s.slice(-120):s.slice(Math.max(0,i-5),i+120)).join("\n").slice(0,60000);console.log("::error title=Integration tests::"+out.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"))'
            exit 1
          }

      - name: Production build
        run: npm run build

      - name: Seed demo data and smoke-test the running app
        env:
          SEED_DEMO_DATA: "true"
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/ >/dev/null && break; sleep 1; done
          set -e
          curl -sf http://localhost:3100/setup | grep -q "Create the platform administrator"
          npm run db:seed
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/setup)" = "307"
          curl -sf http://localhost:3100/ | grep -q "DEMO"
          curl -sf http://localhost:3100/login >/dev/null
          curl -sf http://localhost:3100/signup >/dev/null
          REF=$(curl -sf http://localhost:3100/ | grep -o 'properties/PROP-[A-Z0-9]*' | head -1)
          curl -sf "http://localhost:3100/$REF" | grep -q "Verify this property"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/app)" = "307"
          echo "Smoke test passed"

      - name: Save the resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
