name: Guide clips
on: push
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 get.py
      - name: Publish the clips as a release (no file size limit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete guide-clips -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create guide-clips out/clips/*.mp4 -R ${{ github.repository }} --target ${{ github.sha }} --title "Guide video clips (marketing only)" --notes "Mixkit free licence clips for the getting-started video." --prerelease
          rm -rf out/clips
      - name: Publish
        run: |
          cp -r out /tmp/out
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git checkout --orphan guide-clips-out
          git rm -rf -q --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/* .
          git add -A && git commit -q -m "Guide clips"
          git push -q -f origin guide-clips-out
