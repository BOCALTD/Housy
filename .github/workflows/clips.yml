name: Guide clips
on: push
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 get.py
      - run: for f in out/clips/*.mp4; do echo "$(basename $f) $(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 $f) $(ffprobe -v error -show_entries format=duration -of csv=p=0 $f)"; done | tee out/clips.txt
      - name: Publish
        run: |
          cp -r out /tmp/out
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git checkout --orphan guide-clips-out
          git rm -rf -q --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/* .
          git add -A && git commit -q -m "Guide clips"
          git push -q -f origin guide-clips-out
