name: Fetch demonstration photos
# Run by hand. Downloads candidate photographs from Unsplash (Unsplash Licence) to the demo-media branch, where they are
# reviewed and the suitable ones copied into prisma/demo-media. The app never downloads anything at run time.
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p /tmp/media
          ok=0; bad=0
          while read -r id; do
            [ -z "$id" ] && continue
            code=$(curl -sL -o "/tmp/media/$id.jpg" -w '%{http_code}' "https://images.unsplash.com/photo-$id?w=1600&q=78&fm=jpg&fit=max")
            if [ "$code" = "200" ] && [ -s "/tmp/media/$id.jpg" ]; then ok=$((ok+1)); echo "ok $id" >> /tmp/media/report.txt; else rm -f "/tmp/media/$id.jpg"; bad=$((bad+1)); echo "missing $id $code" >> /tmp/media/report.txt; fi
          done < scripts/demo-media-ids.txt
          echo "::notice title=Photos::$ok downloaded, $bad missing"
      - name: Publish to the demo-media branch
        run: |
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git checkout --orphan demo-media
          git rm -rf -q --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/media/* .
          git add -A && git commit -q -m "Candidate demonstration photos"
          git push -q -f origin demo-media
