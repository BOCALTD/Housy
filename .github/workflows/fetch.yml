name: fetch-media
on: { push: { branches: [media-fetch] } }
permissions: { contents: write }
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[got]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p got
          sort -u ids.txt | while read id; do
            [ -z "$id" ] && continue
            code=$(curl -sL -o "got/$id.jpg" -w '%{http_code} %{content_type}' "https://images.unsplash.com/photo-$id?w=1600&q=80&fm=jpg&fit=max")
            case "$code" in "200 image/jpeg"*) echo "ok $id";; *) echo "bad $id $code"; rm -f "got/$id.jpg";; esac
          done | tee got/log.txt
          git config user.name ci; git config user.email ci@example.invalid
          git add got; git commit -qm "[got] candidates"; git push
