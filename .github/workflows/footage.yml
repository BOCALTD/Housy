name: Guide footage
on: push
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core && pip install pillow
      - run: |
          mkdir -p out
          python3 scan.py black-woman-driving african-woman-driving black-man-driving black-woman-car black-woman-passenger black-couple-car black-woman-phone black-man-phone black-woman-smartphone-street black-woman-walking-street black-woman-city african-american-woman-walking black-woman-motorcycle black-man-motorcycle black-woman-bicycle black-woman-scooter black-woman-taxi black-woman-keys black-woman-new-apartment black-couple-new-home black-real-estate-agent black-woman-handshake black-woman-happy black-friends-car black-woman-laptop black-woman-moving-boxes
          python3 sheets.py
      - name: Publish
        run: |
          cp -r out /tmp/out
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git checkout --orphan guide-footage-out
          git rm -rf -q --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/* . ; rm -rf rows
          git add -A && git commit -q -m "Guide footage contact sheets"
          git push -q -f origin guide-footage-out
