name: Guide footage
on: push
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core && pip install pillow
      - run: |
          mkdir -p out
          python3 scan.py range:31985-32060 range:44545-44570 range:41160-41185 range:24320-24335 range:46488-46500 range:47965-47980 man-driving-a-car-in-the-city driving-in-traffic car-passenger city-traffic motorcycle-taxi riding-a-motorcycle-in-the-city scooter-city people-crossing-the-street busy-street crowd-walking-city street-market house-keys real-estate-agent showing-a-house handshake new-home couple-new-house
          python3 sheets.py
      - name: Publish
        run: |
          cp -r out /tmp/out
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git checkout --orphan guide-footage-out
          git rm -rf -q --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/* . ; rm -rf rows
          git add -A && git commit -q -m "Guide footage contact sheets"
          git push -q -f origin guide-footage-out
