# /etc/nginx/sites-available/housy  (certbot adds the TLS lines and the port-80 redirect)
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # Uploads are capped at 4 MB by the app; allow a little headroom for the form.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITE, never append: the app trusts the first address in this header for its rate limits, so a visitor must not be able to supply it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Received emails from the email provider can carry attachments (each kept only up to 4 MB by the app).
    location = /api/inbound-email {
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Files and voice notes sent in chats can be up to 10 MB (checked again by the app).
    location ~ ^/api/messages/[^/]+/attachments$ {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
